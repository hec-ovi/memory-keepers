[project]
name = "mk-voice"
version = "0.1.0"
description = "Speech router: Cloud Text-to-Speech and Speech-to-Text"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "google-cloud-texttospeech>=2.37",
    "google-cloud-speech>=2.40",
]

[build-system]
requires = ["uv_build>=0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mk_voice"
