<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memory Keepers — Architecture</title>
<meta name="description" content="Interactive architecture map of Memory Keepers: a 3D island of AI keeper agents built on Google ADK, Gemini on Vertex AI, Firestore, Pub/Sub and Cloud Run.">
<style>
:root{
  --bg:#0b0703; --surface:#170e06; --surface-2:#1f1408; --surface-3:#28190a;
  --line:#3d2a14; --line-soft:#2b1d0e; --text:#f6e7cf; --muted:#c99a66; --faint:#8a7050;
  --cyan:#3fe0ff; --steel:#8fa9c9; --gold:#ffb658; --green:#6ede87; --violet:#b9a7f8; --danger:#ff7a5c;
  --shadow:rgba(0,0,0,.55);
  --sans:"Segoe UI","Noto Sans",system-ui,-apple-system,sans-serif;
  --display:"Bahnschrift","DIN Alternate","Franklin Gothic Medium","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --nav-w:262px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:13px; line-height:1.55;
  overflow:hidden;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
::selection{background:rgba(63,224,255,.25)}
a{color:var(--cyan); text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--cyan); outline-offset:2px; border-radius:0}
button{font-family:inherit}
h1,h2,h3,h4{margin:0; font-weight:650; letter-spacing:.01em; font-family:var(--display)}

/* ---------- app shell ---------- */
#app{
  position:fixed; inset:0;
  display:grid; grid-template-columns:var(--nav-w) 1fr;
  background:var(--bg);
}

/* ---------- left nav ---------- */
#nav{
  display:flex; flex-direction:column; min-height:0;
  background:linear-gradient(180deg,#150d05,#0e0904);
  border-right:1px solid var(--line);
}
.brand{padding:20px 18px 14px; border-bottom:1px solid var(--line-soft)}
.eyebrow{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.34em; font-weight:700;
  color:var(--cyan); text-transform:uppercase;
}
.brand h1{font-size:18px; margin-top:6px; line-height:1.15}
.brand .subtitle{color:var(--muted); font-size:11.5px; margin-top:6px; max-width:214px}

.navlist{flex:1 1 auto; min-height:0; overflow-y:auto; padding:10px 10px 14px}
.navlist::-webkit-scrollbar{width:9px}
.navlist::-webkit-scrollbar-thumb{background:var(--surface-3); border-radius:0}

.navsec{margin-bottom:2px}
.navsec>button{
  width:100%; display:flex; align-items:center; gap:9px;
  background:transparent; border:1px solid transparent; border-radius:0;
  color:var(--text); padding:8px 9px; cursor:pointer; text-align:left; font-size:12.5px;
}
.navsec>button:hover{background:var(--surface-2)}
.navsec.active>button{background:var(--surface-3); border-color:var(--line)}
.navsec.active>button .nsecLabel{color:var(--text)}
.nsecLabel{flex:1 1 auto; font-weight:550}
.dot{width:9px; height:9px; border-radius:0; flex:0 0 auto; box-shadow:0 0 0 3px rgba(255,255,255,.03)}
.caret{color:var(--faint); font-size:10px; transition:transform .18s ease}
.navsec.open .caret{transform:rotate(90deg)}

.subitems{list-style:none; margin:2px 0 6px; padding:0 0 0 24px; display:none}
.navsec.open .subitems{display:block}
.subitems li{margin:0}
.subitems button{
  width:100%; text-align:left; background:transparent; border:0; cursor:pointer;
  color:var(--muted); font-family:var(--mono); font-size:11px; padding:4px 8px; border-radius:0;
  border-left:1px solid var(--line-soft); margin-left:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.subitems button:hover{color:var(--text); background:var(--surface-2)}

.navfoot{
  padding:11px 18px; border-top:1px solid var(--line-soft);
  color:var(--faint); font-size:11px; font-family:var(--mono);
}

/* ---------- main ---------- */
#main{display:grid; grid-template-rows:auto 1fr; min-width:0; min-height:0}
.topbar{
  display:flex; align-items:center; gap:16px; justify-content:space-between;
  padding:14px 20px; border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#140c05,#0e0904);
}
.crumb{min-width:0}
.crumb h2{font-size:16px; display:flex; align-items:center; gap:8px}
.crumb .crumbSub{color:var(--muted); font-size:11.5px; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.modeToggle{
  display:inline-flex; background:var(--surface); border:1px solid var(--line);
  border-radius:0; padding:3px; flex:0 0 auto;
}
.segbtn{
  background:transparent; border:0; color:var(--muted); cursor:pointer;
  padding:6px 15px; border-radius:0; font-size:12px; font-weight:600; letter-spacing:.01em;
}
.segbtn:hover{color:var(--text)}
.segbtn.active{background:var(--cyan); color:#04191f; box-shadow:0 3px 10px rgba(63,224,255,.28)}

/* ---------- stage ---------- */
#stage{
  position:relative; min-width:0; min-height:0; overflow:hidden;
  background:
    repeating-linear-gradient(0deg, rgba(255,196,128,.028) 0 1px, transparent 1px 3px),
    linear-gradient(var(--line-soft) 1px, transparent 1px) 0 0/36px 36px,
    linear-gradient(90deg, var(--line-soft) 1px, transparent 1px) 0 0/36px 36px,
    radial-gradient(1200px 620px at 78% -12%, rgba(63,224,255,.06), transparent 60%),
    var(--bg);
}

/* ---------- map ---------- */
.mapWrap{position:absolute; inset:0}
#atlas{width:100%; height:100%; display:block; touch-action:none; cursor:grab}
#atlas.grabbing{cursor:grabbing}
.node{cursor:pointer}
.nbox{fill:var(--surface-2); stroke:var(--line); stroke-width:1.4; filter:drop-shadow(0 5px 12px var(--shadow))}
.node:hover .nbox,.node:focus-visible .nbox{stroke:var(--cyan)}
.node:focus-visible{outline:none}
.node:focus-visible .nbox{stroke-width:2}
.nlabel{fill:var(--text); font-weight:650; font-size:13px; font-family:var(--mono)}
.nkind{font-size:10px; font-family:var(--mono); letter-spacing:.06em; text-transform:uppercase; opacity:.92}
.edge{fill:none; stroke-width:1.7}
.elabel{fill:var(--muted); font-size:10px; font-family:var(--mono)}
.elabel-bg{fill:var(--bg); opacity:.9; stroke:var(--line-soft); stroke-width:.75}
.grp{fill:rgba(143,169,201,.05); stroke:var(--steel); stroke-width:1.2; stroke-dasharray:5 5}
.grpLabel{fill:var(--steel); font-size:11px; font-family:var(--mono); letter-spacing:.05em; text-transform:uppercase}

.mapctl{position:absolute; left:14px; bottom:14px; display:flex; gap:7px; z-index:4}
.mapctl button{
  background:var(--surface); border:1px solid var(--line); color:var(--text);
  padding:6px 12px; border-radius:0; cursor:pointer; font-size:11.5px; font-weight:600;
  box-shadow:0 4px 12px var(--shadow);
}
.mapctl button:hover{border-color:var(--cyan); color:var(--cyan)}
.legend{
  position:absolute; left:14px; top:14px; z-index:4;
  background:rgba(15,9,4,.85); backdrop-filter:blur(3px);
  border:1px solid var(--line); border-radius:0; padding:9px 11px;
  display:flex; flex-direction:column; gap:5px; max-width:236px;
}
.legend .lgttl{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin-bottom:2px}
.pill{display:flex; align-items:center; gap:8px; font-size:11px; color:var(--muted)}
.hint{
  position:absolute; right:14px; bottom:14px; z-index:4;
  font-family:var(--mono); font-size:10.5px; color:var(--faint);
  background:rgba(15,9,4,.7); border:1px solid var(--line-soft); border-radius:0; padding:5px 9px;
}

/* ---------- text view ---------- */
.textWrap{position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; padding:26px 24px 90px}
.textWrap::-webkit-scrollbar{width:11px}
.textWrap::-webkit-scrollbar-thumb{background:var(--surface-3); border-radius:0}
.doc{max-width:1080px; margin:0 auto}
.lede{color:var(--muted); font-size:14px; line-height:1.62; max-width:70ch; margin:0 0 22px}
.lede strong{color:var(--text); font-weight:650}
.lede b{color:var(--text); font-weight:600}

.doc-section{
  border:1px solid var(--line); border-radius:0;
  background:linear-gradient(180deg,var(--surface),#120b05);
  padding:18px 18px 20px; margin-bottom:18px;
}
.ds-head{margin-bottom:14px}
.ds-head h3{font-size:15px}
.ds-head .ds-sub{color:var(--muted); font-size:12px; margin-top:4px; max-width:74ch}
.eyebrow-s{font-family:var(--mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--cyan); display:block; margin-bottom:5px}

.cardgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); gap:12px}
.card{
  border:1px solid var(--line); border-radius:0; background:var(--surface-2);
  padding:12px 13px; min-width:0;
}
.card.wide{grid-column:1/-1}
.ct{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.clabel{font-family:var(--mono); font-size:12.5px; font-weight:650; color:var(--text)}
.kindtag{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted); border:1px solid var(--line); border-radius:0; padding:1px 8px; margin-left:auto;
}
.sum{color:var(--muted); font-size:12px; margin-top:7px; line-height:1.55}
.sum b{color:var(--text); font-weight:600}
.row{margin-top:9px; display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.row .lbl{font-family:var(--mono); font-size:10px; color:var(--faint); text-transform:uppercase; letter-spacing:.06em}
.flag{
  font-family:var(--mono); font-size:10px; padding:2px 8px; border-radius:0; border:1px solid;
}
.flag.gate{color:var(--gold); border-color:rgba(255,182,88,.5); background:rgba(255,182,88,.08)}
.flag.loop{color:var(--violet); border-color:rgba(185,167,248,.5); background:rgba(185,167,248,.08)}
.flag.gated{color:var(--faint); border-color:var(--line); background:rgba(138,112,80,.08)}
.flag.emit{color:var(--green); border-color:rgba(110,222,135,.5); background:rgba(110,222,135,.08)}
.flag.dark{color:var(--danger); border-color:rgba(255,122,92,.5); background:rgba(255,122,92,.08)}

.chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
.chip{
  font-family:var(--mono); font-size:11px; color:var(--text);
  background:var(--surface-3); border:1px solid var(--line); border-radius:0; padding:3px 9px;
}
.chip.mut{color:var(--muted)}
.grouplbl{font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--steel); margin:12px 0 2px; display:block}

.jsonbox{
  background:#0a0602; border:1px solid var(--line); border-radius:0;
  padding:13px 14px; overflow-x:auto; margin:12px 0 2px;
  font-family:var(--mono); font-size:12px; line-height:1.6; color:var(--text);
}
.jsonbox code{font-family:inherit}
.jsonbox .k{color:var(--cyan)}
.jsonbox .s{color:var(--gold)}
.jsonbox .n{color:var(--violet)}
.jsonbox .b{color:var(--danger)}

.overviewGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:13px}
a.ocard{
  display:flex; flex-direction:column; gap:6px; text-decoration:none;
  border:1px solid var(--line); border-radius:0; background:var(--surface-2);
  padding:14px 15px; color:var(--text);
}
a.ocard:hover{border-color:var(--cyan); text-decoration:none; transform:translateY(-1px); background:var(--surface-3)}
a.ocard{transition:transform .15s ease, border-color .15s ease, background .15s ease}
.ocard .otop{display:flex; align-items:center; gap:9px}
.ocard .otitle{font-size:13.5px; font-weight:650}
.ocard .odesc{color:var(--muted); font-size:11.5px; line-height:1.5}
.ocard .ogo{font-family:var(--mono); font-size:10px; color:var(--cyan); letter-spacing:.08em; text-transform:uppercase; margin-top:2px}

.callout{
  border:1px solid var(--line); border-left:3px solid var(--cyan); border-radius:0;
  background:rgba(63,224,255,.05); padding:11px 13px; color:var(--muted); font-size:12px; margin-top:12px;
}
.callout b{color:var(--text)}
.callout.dark{border-left-color:var(--violet); background:rgba(185,167,248,.05)}

/* ---------- node detail (full-screen) ---------- */
.stepWrap{position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; padding:26px 24px 90px}
.stepWrap::-webkit-scrollbar{width:11px}
.stepWrap::-webkit-scrollbar-thumb{background:var(--surface-3); border-radius:0}
.stepDetail{max-width:1080px; margin:0 auto}
.stepDetail code{font-family:var(--mono); font-size:11.5px; background:var(--surface-3); border:1px solid var(--line); border-radius:0; padding:1px 5px; color:var(--text)}
.stepHead{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:14px}
.stepBack{
  background:var(--surface); border:1px solid var(--line); color:var(--text);
  padding:8px 14px; border-radius:0; cursor:pointer; font-size:12px; font-weight:600;
  box-shadow:0 4px 12px var(--shadow); flex:0 0 auto;
}
.stepBack:hover{border-color:var(--cyan); color:var(--cyan)}
.stepHeadText{display:flex; flex-direction:column; gap:3px; min-width:0; flex:1 1 240px}
.stepEyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint)}
.stepTitle{font-size:20px; line-height:1.2}
.stepPill{
  font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  border:1px solid; border-radius:0; padding:3px 11px; flex:0 0 auto; white-space:nowrap;
  background:rgba(255,255,255,.03);
}
.stepProse{color:var(--muted); font-size:13px; line-height:1.68; max-width:78ch; margin:0}
.stepProse b, .stepList b{color:var(--text); font-weight:600}
.stepList{margin:6px 0 0; padding-left:20px; color:var(--muted); font-size:12.5px; line-height:1.62}
.stepList li{margin-bottom:8px}

/* ---------- responsive ---------- */
@media (max-width:820px){
  body{overflow:auto}
  #app{grid-template-columns:1fr; grid-template-rows:auto 1fr; position:fixed; inset:0}
  #nav{border-right:0; border-bottom:1px solid var(--line); max-height:44vh}
  .brand{padding:14px 16px 10px}
  .navlist{max-height:none}
  .topbar{padding:11px 14px}
  .textWrap{padding:18px 14px 80px}
  .stepWrap{padding:18px 14px 80px}
  .stepHead{gap:10px}
  .stepTitle{font-size:17px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important; animation:none!important; scroll-behavior:auto!important}
  a.ocard:hover{transform:none}
}
</style>
</head>
<body>
<div id="app">
  <aside id="nav" aria-label="Sections">
    <div class="brand">
      <div class="eyebrow">memory-keepers</div>
      <h1>Architecture</h1>
      <div class="subtitle">An island of memory keeper agents: each keeper holds one topic of your memories as books on shelves.</div>
    </div>
    <nav class="navlist" id="navlist" aria-label="Section navigation"></nav>
    <div class="navfoot">Built from the box contracts.</div>
  </aside>

  <main id="main">
    <header class="topbar">
      <div class="crumb">
        <h2 id="crumbTitle">Overview</h2>
        <div class="crumbSub" id="crumbSub"></div>
      </div>
      <div class="modeToggle" role="tablist" aria-label="View mode">
        <button class="segbtn" id="mMap" role="tab" aria-selected="false">Map</button>
        <button class="segbtn active" id="mText" role="tab" aria-selected="true">Text</button>
      </div>
    </header>
    <section id="stage" aria-live="polite"></section>
  </main>
</div>

<script>
"use strict";
(function(){
  var NODE_W=200, NODE_H=64;
  var LANE={cyan:'var(--cyan)',steel:'var(--steel)',gold:'var(--gold)',green:'var(--green)',violet:'var(--violet)',faint:'var(--faint)'};
  var EDGE={
    flow:{stroke:'var(--muted)',dash:'',m:'m-muted'},
    pass:{stroke:'var(--green)',dash:'',m:'m-green'},
    loop:{stroke:'var(--violet)',dash:'',m:'m-violet'},
    gated:{stroke:'var(--faint)',dash:'6 5',m:'m-faint'},
    seam:{stroke:'var(--steel)',dash:'6 5',m:'m-steel'},
    media:{stroke:'var(--gold)',dash:'4 4',m:'m-gold'}
  };

  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function hl(str){
    return esc(str).replace(/("(?:\\.|[^"\\])*"(\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?)/g, function(m){
      var cls='n';
      if(m.charAt(0)==='"'){ cls = /:\s*$/.test(m)?'k':'s'; }
      else if(/^(true|false|null)$/.test(m)) cls='b';
      return '<span class="'+cls+'">'+m+'</span>';
    });
  }

  /* ---------- text builders ---------- */
  var el={
    card:function(o){
      return '<div class="card'+(o.wide?' wide':'')+'"'+(o.id?(' id="'+o.id+'"'):'')+'>'
        +'<div class="ct"><span class="dot" style="background:'+(o.color||'var(--cyan)')+'"></span>'
        +'<span class="clabel">'+o.label+'</span>'+(o.tag?('<span class="kindtag">'+o.tag+'</span>'):'')+'</div>'
        +(o.sum?('<div class="sum">'+o.sum+'</div>'):'')
        +(o.extra||'')+'</div>';
    },
    chips:function(arr,mut){return '<div class="chips">'+arr.map(function(c){return '<span class="chip'+(mut?' mut':'')+'">'+esc(c)+'</span>';}).join('')+'</div>';},
    json:function(s){return '<pre class="jsonbox"><code>'+hl(s)+'</code></pre>';}
  };

  /* =====================================================================
     CONTENT MODEL
     ===================================================================== */
  var COL=function(c){return 48+c*236;};

  // ------------------------------------------------------------- OVERVIEW
  var ovMap={
    legend:[{c:'cyan',t:'game surface'},{c:'steel',t:'engine'},{c:'gold',t:'agents + model tiers'},{c:'green',t:'Google Cloud'},{c:'faint',t:'offline dev'}],
    nodes:[
      {id:'player',x:COL(0),y:250,kind:'human',lane:'cyan',label:'player',
        summary:'Walks a 3D island where every cottage is a keeper holding one topic of your memories.',
        details:['Tell a keeper something and it becomes a book on her shelf; ask her and she answers from the books she opens.','The world id is generated once and kept in localStorage; every request carries it as the <code>X-World</code> header.']},
      {id:'frontend',x:COL(1),y:250,kind:'three.js SPA',lane:'cyan',label:'frontend',
        summary:'Static ES-module three.js SPA: no build step, vendored three.js, procedural textures, holographic UI.',
        details:['Feature modules never import each other; all cross-module talk rides the event bus.','The only runtime network is the engine JSON API.','After a dream finishes it plays the knowledge graph back as the dream movie.']},
      {id:'engine',x:COL(2),y:250,kind:'FastAPI · Cloud Run',lane:'steel',label:'engine',
        summary:'One Cloud Run service serves the JSON API and the frontend statics: one URL, no CORS.',
        details:['Owns meters, caps, background jobs and world scoping; slow work is 202 + poll.','Errors are a closed set of symbols, e.g. <code>LIBRARY_FULL</code>, <code>NEEDS_SLEEP</code>, <code>DREAM_RUNNING</code>.','First touch of a world seeds demo keepers and books.']},
      {id:'agents',x:COL(3),y:250,kind:'Google ADK',lane:'gold',label:'agents',
        summary:'Every agent lives here: the monument root, one agent per keeper, and the dream prose agents.',
        details:['Prompts live in <code>.md</code> files, never inline in code.','Deterministic fallbacks everywhere: a model failure never breaks tell, ask or sleep.','Every model call goes through the gateway, roles <code>chat</code> and <code>dream</code>.']},
      {id:'gemini',x:COL(4),y:120,kind:'Vertex AI',lane:'green',label:'Gemini',
        summary:'Cloud tier: Gemini on Vertex AI, env-selected model.',
        details:['<code>GEMINI_MODEL</code>, default <code>gemini-3.5-flash</code>.','<code>GOOGLE_GENAI_USE_VERTEXAI=TRUE</code> with application default credentials.']},
      {id:'gemma',x:COL(4),y:250,kind:'local tier',lane:'gold',label:'Gemma',
        summary:'Local tier: Gemma served by llama.cpp behind an OpenAI-compatible /v1, reached through LiteLLM.',
        details:['<code>MODEL_TIER=local</code> with <code>LOCAL_MODEL_URL</code> and <code>LOCAL_MODEL_ID</code>.','Runs on the host GPU at zero cloud cost.']},
      {id:'fake',x:COL(4),y:380,kind:'fake tier',lane:'faint',label:'FakeLlm',
        summary:'Deterministic in-process model for tests and offline dev: same request in, same response out.',
        details:['Recognizes the flow marker every prompt carries and emits valid JSON and real function calls.','Reports estimated token usage so the meters still move.']},
      {id:'firestore',x:COL(3),y:430,kind:'Firestore',lane:'green',label:'Firestore',
        summary:'The only store: worlds, keepers, books, sessions and dream runs.',
        details:['Every read and write is scoped to one world; no cross-world query exists.','Locally the official emulator runs the identical code path.']}
    ],
    edges:[
      {from:'player',to:'frontend'},
      {from:'frontend',to:'engine',label:'X-World'},
      {from:'engine',to:'agents'},
      {from:'agents',to:'gemini',type:'pass',label:'cloud'},
      {from:'agents',to:'gemma',type:'media',label:'local'},
      {from:'agents',to:'fake',type:'gated',label:'fake'},
      {from:'agents',to:'firestore',type:'pass',label:'books'}
    ]
  };
  function ovText(){
    var cards=[
      ['boxes','Boxes','Seven plug-and-play boxes, one folder and one CONTRACT.md each.',LANE.steel],
      ['memory','Memory loop','Tell writes a book, ask reads the shelf, sleep compacts, the monument synthesizes.',LANE.gold],
      ['dreaming','Dreaming','The nightly consolidation that links every shelf and wakes the dark side.',LANE.violet],

      +el.card({label:'Cloud Run',tag:'compute',color:LANE.steel,sum:'One service: engine + frontend statics, one URL, no CORS. <code>gcloud run deploy --source .</code> plus Firestore, Pub/Sub, Scheduler.'})
      +el.card({label:'Firestore',tag:'store',color:LANE.green,sum:'The only store: worlds, keepers, books, sessions, dream runs.'})
      +el.card({label:'Pub/Sub',tag:'events',color:LANE.green,sum:'Topic <code>dream-runs</code>; a push subscription delivers every trigger into the token-gated <code>/internal/dream-run</code>.'})
      +el.card({label:'Cloud Scheduler',tag:'cron',color:LANE.green,sum:'Nightly 03:00 (<code>0 3 * * *</code>) posts <code>/internal/nightly</code>; every world dreams.'})
      +el.card({label:'Vertex AI',tag:'model',color:LANE.green,sum:'Gemini, env-selected (<code>GEMINI_MODEL</code>, default <code>gemini-3.5-flash</code>), roles chat and dream.'})
      +el.card({label:'Cloud Speech',tag:'voice',color:LANE.green,sum:'TTS + STT behind the voice router; kind-based voices, hold-T push-to-talk in the dialogs; degrades to text-only.'})
      +'</div></div>'
      +'<div class="doc-section"><div class="ds-head"><h3>Model tiers</h3><p class="ds-sub">One gateway, three tiers; the tier is an env switch, nothing else changes.</p></div>'
      +'<div class="cardgrid">'
      +el.card({label:'cloud',tag:'deployment',color:LANE.green,sum:'Gemini on Vertex AI; credentials via application default credentials.'})
      +el.card({label:'local',tag:'Gemma',color:LANE.gold,sum:'Gemma on llama.cpp (OpenAI-compatible <code>/v1</code>) through LiteLLM; a real model at zero cloud cost.'})
      +el.card({label:'fake',tag:'offline',color:LANE.faint,sum:'Deterministic FakeLlm: valid JSON and real function calls per flow; the test suite runs on it.'})
      +'</div>'
      +'<div class="callout"><b>Free local stack.</b> <code>docker-compose up</code> runs the engine (:8000) against the official Firestore emulator (:8480) and Pub/Sub emulator (:8485), with the Emulator Suite UI at :4000 to browse the database live. Same code path as production.</div>'
      +'</div>';
  }

  // ------------------------------------------------------------- SECTIONS registry
  var SECTIONS=[
    {id:'overview',label:'Overview',dot:'var(--cyan)',sub:'The island, the agents, the stack.',map:ovMap,text:ovText,defaultMode:'text'},
    {id:'boxes',label:'Boxes',dot:'var(--steel)',sub:'Seven boxes, one contract each.',map:bxMap,text:bxText,defaultMode:'map'},
    {id:'memory',label:'Memory loop',dot:'var(--gold)',sub:'Tell, ask, sleep, monument.',map:meMap,text:meText,defaultMode:'map'},
    {id:'dreaming',label:'Dreaming',dot:'var(--violet)',sub:'The consolidation and the dark side.',map:drMap,text:drText,defaultMode:'map'},
    {id:'cloud',label:'Google Cloud',dot:'var(--green)',sub:'Managed services and the free local stack.',map:gcMap,text:gcText,defaultMode:'map'}
  ];
  var SEC_BY_ID={};
  SECTIONS.forEach(function(s){ SEC_BY_ID[s.id]=s; });

  // Node lookup per section (for panel + edges)
  function nodesOf(sec){ return (sec.map&&sec.map.nodes)||[]; }
  function nodeById(sec,id){ var ns=nodesOf(sec); for(var i=0;i<ns.length;i++){ if(ns[i].id===id) return ns[i]; } return null; }

  // Sub-items for nav
  function subItemsOf(sec){
    if(sec.map&&sec.map.nodes){ return sec.map.nodes.slice(0,8).map(function(n){return {label:n.label,node:n.id};}); }
    return [];
  }

  /* =====================================================================
     DOM refs + state
     ===================================================================== */
  var navlist=document.getElementById('navlist');
  var stage=document.getElementById('stage');
  var crumbTitle=document.getElementById('crumbTitle');
  var crumbSub=document.getElementById('crumbSub');
  var mMap=document.getElementById('mMap');
  var mText=document.getElementById('mText');

  var state={section:'overview',mode:'text'};

  /* ---------- nav ---------- */
  function buildNav(){
    if(!navlist) return;
    navlist.innerHTML='';
    SECTIONS.forEach(function(sec){
      var wrap=document.createElement('div');
      wrap.className='navsec'; wrap.setAttribute('data-sec',sec.id);
      var btn=document.createElement('button');
      btn.type='button';
      btn.setAttribute('aria-expanded','false');
      btn.innerHTML='<span class="dot" style="background:'+sec.dot+'"></span>'
        +'<span class="nsecLabel">'+esc(sec.label)+'</span>'
        +'<span class="caret">&#9656;</span>';
      wrap.appendChild(btn);

      var subs=subItemsOf(sec);
      var ul=document.createElement('ul');
      ul.className='subitems';
      subs.forEach(function(si){
        var li=document.createElement('li');
        var sb=document.createElement('button');
        sb.type='button'; sb.textContent=si.label;
        sb.addEventListener('click',function(e){
          e.stopPropagation();
          selectSection(sec.id);
          var n=nodeById(sec,si.node);
          if(n) openNodeDetail(n,sec);
        });
        li.appendChild(sb); ul.appendChild(li);
      });
      wrap.appendChild(ul);

      btn.addEventListener('click',function(){ selectSection(sec.id); });
      navlist.appendChild(wrap);
    });
  }

  function syncNav(){
    var secs=navlist.querySelectorAll('.navsec');
    for(var i=0;i<secs.length;i++){
      var s=secs[i]; var id=s.getAttribute('data-sec');
      var on=(id===state.section);
      s.classList.toggle('active',on);
      s.classList.toggle('open',on);
      var b=s.querySelector('button'); if(b) b.setAttribute('aria-expanded',on?'true':'false');
    }
  }

  /* ---------- mode toggle ---------- */
  function setMode(mode){
    state.mode=mode;
    mMap.classList.toggle('active',mode==='map');
    mText.classList.toggle('active',mode==='text');
    mMap.setAttribute('aria-selected',mode==='map'?'true':'false');
    mText.setAttribute('aria-selected',mode==='text'?'true':'false');
    renderStage();
  }
  mMap.addEventListener('click',function(){ setMode('map'); });
  mText.addEventListener('click',function(){ setMode('text'); });

  /* ---------- section select ---------- */
  function selectSection(id){
    var sec=SEC_BY_ID[id]; if(!sec) return;
    var first=(state.section!==id);
    state.section=id;
    crumbTitle.textContent=sec.label;
    crumbSub.textContent=sec.sub||'';
    syncNav();
    if(first){ state.mode=sec.defaultMode||'map'; }
    setMode(state.mode);
  }

  /* =====================================================================
     STAGE render
     ===================================================================== */
  function renderStage(){
    var sec=SEC_BY_ID[state.section];
    state.step=null;
    if(state.mode==='map' && sec.map && sec.map.nodes && sec.map.nodes.length){
      renderMap(sec);
    } else {
      renderText(sec);
    }
  }

  function renderText(sec){
    var html='<div class="textWrap"><div class="doc">'+(sec.text?sec.text():'')+'</div></div>';
    stage.innerHTML=html;
    // wire overview ocards
    var links=stage.querySelectorAll('a.ocard[data-goto]');
    for(var i=0;i<links.length;i++){
      (function(a){
        a.addEventListener('click',function(e){ e.preventDefault(); selectSection(a.getAttribute('data-goto')); });
      })(links[i]);
    }
  }

  /* ---------- map ---------- */
  function markerDefs(){
    var colors={'m-muted':'var(--muted)','m-green':'var(--green)','m-violet':'var(--violet)','m-faint':'var(--faint)','m-steel':'var(--steel)','m-gold':'var(--gold)'};
    var out='<defs>';
    for(var id in colors){
      out+='<marker id="'+id+'" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7.5,3 L0,6 Z" style="fill:'+colors[id]+'"></path></marker>';
    }
    out+='</defs>';
    return out;
  }

  // Universal, geometry-driven edge router used by EVERY section.
  // It picks A's exit port and B's entry port on the sides that face each
  // other (horizontal when |dx|>=|dy|, else vertical), then draws a cubic
  // bezier that leaves A and arrives at B perpendicular to those faces.
  // `off` separates a bidirectional pair into two arcs.
  var BIDIR_OFF=0.26;
  function fmt(v){ return Math.round(v*100)/100; }
  function edgeGeom(a,b,off){
    off=off||0;
    var wa=a.w||NODE_W, ha=a.h||NODE_H, wb=b.w||NODE_W, hb=b.h||NODE_H;
    var acx=a.x+wa/2, acy=a.y+ha/2, bcx=b.x+wb/2, bcy=b.y+hb/2;
    var dx=bcx-acx, dy=bcy-acy;
    var K=0.42, MIN=42;
    var sx,sy,ex,ey,c1x,c1y,c2x,c2y;
    if(Math.abs(dx)>=Math.abs(dy)){
      var right=dx>=0;
      sx=right?a.x+wa:a.x;   ex=right?b.x:b.x+wb;
      sy=acy+off*ha;         ey=bcy+off*hb;
      var cd=Math.max(MIN,Math.abs(ex-sx)*K), sg=right?1:-1;
      c1x=sx+sg*cd; c1y=sy;  c2x=ex-sg*cd; c2y=ey;
    } else {
      var down=dy>=0;
      sy=down?a.y+ha:a.y;    ey=down?b.y:b.y+hb;
      sx=acx+off*wa;         ex=bcx+off*wb;
      var cd2=Math.max(MIN,Math.abs(ey-sy)*K), sg2=down?1:-1;
      c1x=sx; c1y=sy+sg2*cd2; c2x=ex; c2y=ey-sg2*cd2;
    }
    return {sx:sx,sy:sy,ex:ex,ey:ey,c1x:c1x,c1y:c1y,c2x:c2x,c2y:c2y};
  }
  function edgePath(g){
    return 'M'+fmt(g.sx)+','+fmt(g.sy)+' C'+fmt(g.c1x)+','+fmt(g.c1y)+' '+fmt(g.c2x)+','+fmt(g.c2y)+' '+fmt(g.ex)+','+fmt(g.ey);
  }
  function bezMid(g){
    return {x:0.125*g.sx+0.375*g.c1x+0.375*g.c2x+0.125*g.ex,
            y:0.125*g.sy+0.375*g.c1y+0.375*g.c2y+0.125*g.ey};
  }

  function renderMap(sec){
    var data=sec.map;
    var legend=(data.legend||[]).map(function(l){
      return '<div class="pill"><span class="dot" style="background:'+LANE[l.c]+'"></span>'+esc(l.t)+'</div>';
    }).join('');

    var groupsSvg=(data.groups||[]).map(function(g){
      return '<rect class="grp" x="'+g.x+'" y="'+g.y+'" width="'+g.w+'" height="'+g.h+'"></rect>'
        +'<text class="grpLabel" x="'+(g.x+14)+'" y="'+(g.y+22)+'">'+esc(g.label)+'</text>';
    }).join('');

    var edgeSet={};
    data.edges.forEach(function(e){ edgeSet[e.from+' '+e.to]=true; });
    var edgesSvg=data.edges.map(function(e){
      var a=nodeById(sec,e.from), b=nodeById(sec,e.to);
      if(!a||!b) return '';
      var cfg=EDGE[e.type||'flow']||EDGE.flow;
      var off=0;
      if(edgeSet[e.to+' '+e.from]){ off=(String(e.from)<String(e.to))?BIDIR_OFF:-BIDIR_OFF; }
      var g=edgeGeom(a,b,off);
      var d=edgePath(g);
      var path='<path class="edge" data-from="'+esc(e.from)+'" data-to="'+esc(e.to)+'" d="'+d+'" style="stroke:'+cfg.stroke+(cfg.dash?';stroke-dasharray:'+cfg.dash:'')+'" marker-end="url(#'+cfg.m+')"></path>';
      var lbl='';
      if(e.label){
        var m=bezMid(g);
        var tw=e.label.length*6.1+10;
        lbl='<g transform="translate('+fmt(m.x)+','+fmt(m.y)+')"><rect class="elabel-bg" x="'+(-tw/2)+'" y="-9" width="'+tw+'" height="16"></rect>'
          +'<text class="elabel" x="0" y="2" text-anchor="middle">'+esc(e.label)+'</text></g>';
      }
      return path+lbl;
    }).join('');

    var nodesSvg=data.nodes.map(function(n){
      var w=n.w||NODE_W, h=n.h||NODE_H;
      var label=n.label||n.id;
      return '<g class="node lane-'+n.lane+'" data-id="'+esc(n.id)+'" tabindex="0" role="button" aria-label="'+esc(label)+'" transform="translate('+n.x+','+n.y+')">'
        +'<rect class="nbox" width="'+w+'" height="'+h+'"></rect>'
        +'<rect x="0" y="0" width="6" height="'+h+'" style="fill:'+LANE[n.lane]+'"></rect>'
        +'<text class="nlabel" x="18" y="27">'+esc(label)+'</text>'
        +'<text class="nkind" x="18" y="46" style="fill:'+LANE[n.lane]+'">'+esc(n.kind||'')+'</text>'
        +'</g>';
    }).join('');

    stage.innerHTML=
      '<div class="mapWrap">'
      +'<svg id="atlas" role="img" aria-label="Map of '+esc(sec.label)+'">'
      +markerDefs()
      +'<g id="viewport">'+groupsSvg+edgesSvg+nodesSvg+'</g>'
      +'</svg></div>'
      +'<div class="legend"><div class="lgttl">Legend</div>'+legend+'</div>'
      +'<div class="mapctl"><button type="button" id="btnFit">Fit</button><button type="button" id="btnReset">Reset</button></div>'
      +'<div class="hint">drag to move &middot; wheel to zoom &middot; click a node</div>';

    wireMap(sec);
  }

  var view={tx:40,ty:40,k:1};
  function wireMap(sec){
    var svg=document.getElementById('atlas');
    var vp=document.getElementById('viewport');
    if(!svg||!vp) return;

    function apply(){ vp.setAttribute('transform','translate('+view.tx+','+view.ty+') scale('+view.k+')'); }
    function bbox(){
      var ns=sec.map.nodes, gs=sec.map.groups||[];
      var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
      ns.forEach(function(n){ var w=n.w||NODE_W,h=n.h||NODE_H; minx=Math.min(minx,n.x); miny=Math.min(miny,n.y); maxx=Math.max(maxx,n.x+w); maxy=Math.max(maxy,n.y+h); });
      gs.forEach(function(g){ minx=Math.min(minx,g.x); miny=Math.min(miny,g.y); maxx=Math.max(maxx,g.x+g.w); maxy=Math.max(maxy,g.y+g.h); });
      return {minx:minx,miny:miny,maxx:maxx,maxy:maxy};
    }
    function fit(){
      var bb=bbox(); var pad=54;
      var bw=(bb.maxx-bb.minx)+pad*2, bh=(bb.maxy-bb.miny)+pad*2;
      var sw=stage.clientWidth||900, sh=stage.clientHeight||600;
      var k=Math.min(sw/bw, sh/bh, 1.15); if(!isFinite(k)||k<=0) k=1;
      view.k=k;
      view.tx=(sw-bw*k)/2 - (bb.minx-pad)*k;
      view.ty=(sh-bh*k)/2 - (bb.miny-pad)*k;
      apply();
    }
    function reset(){ view.k=1; view.tx=40; view.ty=36; apply(); }

    var fitBtn=document.getElementById('btnFit'), resetBtn=document.getElementById('btnReset');
    if(fitBtn) fitBtn.addEventListener('click',fit);
    if(resetBtn) resetBtn.addEventListener('click',reset);

    // pan
    var dragging=false, moved=false, sx=0, sy=0, otx=0, oty=0;
    svg.addEventListener('pointerdown',function(e){
      if(e.target.closest('.node')) return;
      dragging=true; moved=false; sx=e.clientX; sy=e.clientY; otx=view.tx; oty=view.ty;
      svg.classList.add('grabbing');
      try{ svg.setPointerCapture(e.pointerId); }catch(_){}
    });
    svg.addEventListener('pointermove',function(e){
      if(!dragging) return;
      var dx=e.clientX-sx, dy=e.clientY-sy;
      if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
      view.tx=otx+dx; view.ty=oty+dy; apply();
    });
    function endDrag(e){ dragging=false; svg.classList.remove('grabbing'); if(e){ try{ svg.releasePointerCapture(e.pointerId); }catch(_){} } }
    svg.addEventListener('pointerup',endDrag);
    svg.addEventListener('pointercancel',endDrag);
    svg.addEventListener('pointerleave',function(e){ if(dragging) endDrag(e); });

    // zoom
    svg.addEventListener('wheel',function(e){
      e.preventDefault();
      var rect=svg.getBoundingClientRect();
      var mx=e.clientX-rect.left, my=e.clientY-rect.top;
      var factor=e.deltaY<0?1.12:1/1.12;
      var nk=Math.max(0.28,Math.min(2.6,view.k*factor));
      view.tx=mx-(mx-view.tx)*(nk/view.k);
      view.ty=my-(my-view.ty)*(nk/view.k);
      view.k=nk; apply();
    },{passive:false});

    // node interactions
    var nodeEls=svg.querySelectorAll('.node');
    for(var i=0;i<nodeEls.length;i++){
      (function(g){
        var id=g.getAttribute('data-id');
        g.addEventListener('click',function(){ if(moved) return; var n=nodeById(sec,id); if(n) openNodeDetail(n,sec); });
        g.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); var n=nodeById(sec,id); if(n) openNodeDetail(n,sec); } });
      })(nodeEls[i]);
    }

    requestAnimationFrame(fit);
  }

  /* ---------- node detail (full-screen) ----------
     A node click opens a full-screen detail with an explicit "Back to
     <Section>" control that returns to that section's current overview
     (Map or Text). Escape and the topbar toggle also return. */
  function exitDetail(){ state.step=null; renderStage(); }
  function nodeBody(node){
    var sum='<div class="doc-section"><div class="ds-head"><span class="eyebrow-s">Summary</span><h3>'+esc(node.label||node.id)+'</h3></div>'
      +'<p class="stepProse">'+(node.summary||'')+'</p></div>';
    var det='';
    if(node.details&&node.details.length){
      det='<div class="doc-section"><div class="ds-head"><h3>Details</h3></div>'
        +'<ul class="stepList">'+node.details.map(function(d){return '<li>'+d+'</li>';}).join('')+'</ul></div>';
    }
    return sum+det;
  }
  function openNodeDetail(node,sec){
    if(!node||!stage||!sec) return;
    state.step=node.id;
    var laneColor=LANE[node.lane]||'var(--cyan)';
    var head='<div class="stepHead">'
      +'<button type="button" class="stepBack" aria-label="Back to '+esc(sec.label)+'">&larr; Back to '+esc(sec.label)+'</button>'
      +'<div class="stepHeadText"><span class="stepEyebrow">'+esc(sec.label)+'</span>'
      +'<h2 class="stepTitle">'+esc(node.label||node.id)+'</h2></div>'
      +'<span class="stepPill" style="color:'+laneColor+';border-color:'+laneColor+'">'+esc(node.kind||'')+'</span>'
      +'</div>';
    stage.innerHTML='<div class="stepWrap"><div class="stepDetail" role="region" aria-label="Detail '+esc(node.id)+'">'
      +head+nodeBody(node)+'</div></div>';

    var back=stage.querySelector('.stepBack');
    if(back){
      back.addEventListener('click',exitDetail);
      try{ back.focus({preventScroll:true}); }catch(_){ back.focus(); }
    }
  }

  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape') return;
    if(stage && stage.querySelector('.stepDetail')){ exitDetail(); }
  });

  /* ---------- resize: refit map ---------- */
  var rt=null;
  window.addEventListener('resize',function(){
    if(state.mode!=='map') return;
    if(rt) clearTimeout(rt);
    rt=setTimeout(function(){ var b=document.getElementById('btnFit'); if(b) b.click(); },160);
  });

  /* ---------- init ---------- */
  buildNav();
  selectSection('overview');
})();
</script>
</body>
</html>
