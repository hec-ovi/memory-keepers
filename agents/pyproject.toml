[project]
name = "mk-agents"
version = "0.1.0"
description = "Agents: the monument, one agent per keeper, dream agents, on a lean tool-calling loop"
requires-python = ">=3.12"
dependencies = ["mk-library", "mk-models"]

[tool.uv.sources]
mk-library = { workspace = true }
mk-models = { workspace = true }

[build-system]
requires = ["uv_build>=0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mk_agents"
