[project]
name = "mk-models"
version = "0.1.0"
description = "Model gateway: Gemini on Vertex AI, local Gemma tier, fake tier for tests"
requires-python = ">=3.12"
dependencies = ["google-adk>=2.6", "httpx>=0.27"]

[project.optional-dependencies]
local = ["litellm>=1.95"]

[build-system]
requires = ["uv_build>=0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mk_models"
