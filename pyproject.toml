[project]
name = "memory-keepers"
version = "0.1.0"
description = "Workspace root; each box is a member package"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["library", "models", "agents", "engine", "dreaming", "voice", "lookups", "agy"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "httpx>=0.28"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["library", "models", "agents", "engine", "dreaming", "voice", "lookups", "agy"]
