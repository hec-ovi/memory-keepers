[project]
name = "mk-lookups"
version = "0.1.0"
description = "External lookups for keepers: YouTube transcripts, song lyrics, movie facts"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "youtube-transcript-api>=1.2",
]

[build-system]
requires = ["uv_build>=0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mk_lookups"
