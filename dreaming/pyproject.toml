[project]
name = "mk-dreaming"
version = "0.1.0"
description = "Consolidation: deterministic linking, sequential theme pass, dark side writer"
requires-python = ">=3.12"
dependencies = ["mk-library", "mk-agents"]

[tool.uv.sources]
mk-library = { workspace = true }
mk-agents = { workspace = true }

[build-system]
requires = ["uv_build>=0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mk_dreaming"
