# Full local stack, zero cloud credits: the official Firestore emulator + the engine.
# Model tiers: fake (default, deterministic), local (llama.cpp on the host), cloud.
services:
  engine:
    build: { context: ., target: dev }
    command: /opt/venv/bin/uvicorn mk_engine.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
    volumes: [".:/app"]
    environment:
      FIRESTORE_EMULATOR_HOST: firestore:8480
      GOOGLE_CLOUD_PROJECT: memory-keepers-local
      MODEL_TIER: ${MODEL_TIER:-fake}
      LOCAL_MODEL_URL: ${LOCAL_MODEL_URL:-http://host.docker.internal:8080/v1}
      LOCAL_MODEL_ID: ${LOCAL_MODEL_ID:-gemma-4-26b-a4b-qat-q4}
      VOICE: ${VOICE:-off}
      OMDB_KEY: ${OMDB_KEY:-}
      AGY_BROKER_URL: http://agy:8765
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [firestore]

  # Firestore emulator + the Emulator Suite UI: browse the database live
  # at http://localhost:4000 (Firestore tab). Data persists across restarts
  # in the mk-firestore-data volume; `docker compose down -v` resets it.
  firestore:
    build: emulators
    ports: ["8480:8480", "4000:4000"]
    volumes: ["mk-firestore-data:/fb/data"]
    # firebase-tools exports only on a graceful Ctrl-C shutdown, so stop
    # with SIGINT instead of docker's default SIGTERM.
    stop_signal: SIGINT
    stop_grace_period: 30s

  # The agy mode's broker: MODEL_TIER=agy docker compose --profile agy up,
  # then attach any MCP-capable CLI to agy/src/mk_agy/mcp_server.py.
  agy:
    build: { context: ., target: dev }
    command: /opt/venv/bin/uvicorn mk_agy.broker:app --host 0.0.0.0 --port 8765
    ports: ["8765:8765"]
    volumes: [".:/app"]
    profiles: ["agy"]

  # docker compose run --rm test
  test:
    build: { context: ., target: dev }
    command: /opt/venv/bin/pytest library models agents engine dreaming voice lookups agy -q
    volumes: [".:/app"]
    profiles: ["test"]

  # docker compose run --rm test-frontend
  test-frontend:
    image: node:24-slim
    working_dir: /app/frontend
    command: sh -c "[ -x node_modules/.bin/vitest ] || npm install --no-audit --no-fund; npx vitest run"
    volumes: [".:/app", "mk-node-modules:/app/frontend/node_modules"]
    profiles: ["test"]

volumes:
  mk-node-modules:
  mk-firestore-data:
